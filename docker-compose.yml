services:
  rabbitmq:
    image: rabbitmq:4.2-management
    container_name: pedidos360-rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-pedidos360}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-pedidos360-local}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rabbitmq_data:
