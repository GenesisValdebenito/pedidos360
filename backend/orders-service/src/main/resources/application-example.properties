spring.application.name=orders-service
server.port=8081

# Spring Security OAuth2 Resource Server (Microsoft Entra ID)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AZURE_TENANT_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.audiences[0]=${AZURE_API_CLIENT_ID}

# PostgreSQL (Supabase)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?prepareThreshold=0
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# Credencial interna compartida solo entre orders-service y catalog-service
pedidos360.catalog.internal-token=${PEDIDOS360_INTERNAL_TOKEN}

# URL base de catalog-service. En local: http://localhost:8082.
# Si orders y catalog corren en EC2 separadas, apuntar al host/privado real.
pedidos360.catalog.url=${PEDIDOS360_CATALOG_URL:http://localhost:8082}

# RabbitMQ: las credenciales por defecto son solo para el Docker local
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:pedidos360}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:pedidos360-local}

# Kafka: evento de pedidos hacia el tópico pedidos.eventos.
# Los tres brokers del compose de infra/ se anuncian en 9092, 9093 y 9094.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
spring.kafka.client-id=orders-service
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.spring.json.add.type.headers=false
