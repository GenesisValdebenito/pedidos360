spring.application.name=notifications-service

# En local, RabbitMQ se ejecuta con Docker en el mismo equipo.
# En EC2, configura RABBITMQ_HOST=localhost y credenciales seguras por entorno.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:pedidos360}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:pedidos360-local}

# El consumidor confirma automáticamente cuando el método termina sin error.
spring.rabbitmq.listener.simple.acknowledge-mode=auto
